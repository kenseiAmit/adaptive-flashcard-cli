[flake8]
max-line-length = 79
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    htmlcov,
    .pytest_cache,
    .mypy_cache

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
exclude = (\.venv|venv|env|htmlcov)

[tool:pytest]
testpaths = tests
norecursedirs = .venv venv env htmlcov .git __pycache__

[coverage:run]
source = .
omit =
    .venv/*
    venv/*
    env/*
    tests/*
    setup.py
