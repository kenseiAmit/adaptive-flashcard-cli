name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa-and-test:
    name: Lint, Type-Check & Pytest (97% Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install QA & testing tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 mypy
      - name: Run Flake8 PEP8 check
        run: flake8 main.py quiz_engine.py ui.py data_loader.py utils/ tests/
      - name: Run Mypy static type check
        run: mypy main.py quiz_engine.py ui.py data_loader.py utils/
      - name: Run 26-test Pytest suite with coverage gate
        run: pytest --cov=. --cov-fail-under=95 -v
